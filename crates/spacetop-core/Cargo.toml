[package]
name = "spacetop-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
serde_json_canonicalizer = "=0.3.2"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
