name: Spacedock Project Mirror

on:
  push:
    branches:
      - "spacedock-state/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: state

      - name: Checkout workflow definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: definition

      - name: Sync GitHub Project draft items
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACEDOCK_PROJECT_TOKEN }}
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/definition/.github/scripts/sync-spacedock-project.js`);
            await sync({ github, context, core });
