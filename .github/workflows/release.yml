name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate tag and Cargo versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${tag}" =~ ${semver} ]]; then
            echo "release tag must look like vX.Y.Z or vX.Y.Z-prerelease: ${tag}" >&2
            exit 1
          fi

          if [[ -n "${RELEASE_NAME}" && "${RELEASE_NAME}" != "${tag}" ]]; then
            echo "GitHub Release title must match tag ${tag}; got ${RELEASE_NAME}" >&2
            exit 1
          fi

          version="${tag#v}"
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          python3 - "${version}" cargo-metadata.json <<'PY'
          import json
          import sys

          expected_version = sys.argv[1]
          metadata_path = sys.argv[2]
          with open(metadata_path, encoding="utf-8") as handle:
              metadata = json.load(handle)

          packages = {package["name"]: package["version"] for package in metadata["packages"]}
          for package_name in ("spacetop", "spacetop-core"):
              actual_version = packages.get(package_name)
              if actual_version != expected_version:
                  raise SystemExit(
                      f"{package_name} version {actual_version!r} does not match tag version {expected_version!r}"
                  )
          PY

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run lint
        run: make lint

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}" -p spacetop
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Validate binary version
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/spacetop"
          actual="$("${binary}" --version)"
          expected="spacetop ${{ needs.validate.outputs.version }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "expected '${expected}', got '${actual}'" >&2
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          target="${{ matrix.target }}"
          package_dir="dist/spacetop-v${version}-${target}"
          mkdir -p "${package_dir}"
          cp "target/${target}/release/spacetop" "${package_dir}/"
          cp README.md "${package_dir}/"
          cp CHANGELOG.md "${package_dir}/"
          tar -C dist -czf "dist/spacetop-v${version}-${target}.tar.gz" "spacetop-v${version}-${target}"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacetop-${{ matrix.target }}
          path: dist/spacetop-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  upload:
    name: Upload assets to GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Upload assets to existing release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          assets=(dist/*.tar.gz dist/SHA256SUMS)

          for asset in "${assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "missing release asset: ${asset}" >&2
              exit 1
            fi
          done

          mapfile -t existing_assets < <(gh release view "${tag}" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            for existing_asset in "${existing_assets[@]}"; do
              if [[ "${existing_asset}" == "${asset_name}" ]]; then
                echo "GitHub Release ${tag} already has asset ${asset_name}" >&2
                exit 1
              fi
            done
          done

          gh release upload "${tag}" "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
